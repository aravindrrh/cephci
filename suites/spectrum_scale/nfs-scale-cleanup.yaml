#===============================================================================================
# Spectrum Scale / NFS cleanup-only suite.
#
# Run at the end of a pipeline (or standalone) to return static Onecloud /
# baremetal nodes to a clean state before the next deploy.
#
# Conf examples:
#   conf/spectrum_scale/spectrum_scale_onecloud_3node.yaml
#   conf/spectrum_scale/spectrum_scale_onecloud_5node_2client.yaml
#
# Example:
#   python3 run.py --cloud baremetal \
#     --global-conf conf/spectrum_scale/spectrum_scale_onecloud_3node.yaml \
#     --suite suites/spectrum_scale/nfs-scale-cleanup.yaml \
#     --rhbuild 9.0 --platform rhel-9 --log-dir logs --log-level info
#===============================================================================================
tests:

  - test:
      name: Spectrum Scale / NFS cleanup
      module: upstream_nfs_cleanup.py
      desc: Uninstall Ganesha RPMs, remove clones, uninstall IBM Scale
      abort-on-fail: false
      timeout: 7200
      config:
        clients: 2
        scale_fs: scale_volume
        nfs_export: /ibm/scale_volume
