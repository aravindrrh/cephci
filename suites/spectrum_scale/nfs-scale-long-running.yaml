#===============================================================================================
# Long-running NFS-Ganesha stress on Spectrum Scale (ci-tests script).
#
# Does NOT deploy Scale/Ganesha. Run after tools suite / upstream_nfs_deploy
# so /ibm/scale_volume/export1 is already exported.
#
# Conf examples:
#   conf/spectrum_scale/spectrum_scale_onecloud_5node_2client.yaml
#   conf/spectrum_scale/spectrum_scale_onecloud_3node.yaml
#
# Runtime: ~6 hours (DURATION_HOURS in long_running_tests.sh).
#===============================================================================================
tests:

  - test:
      name: NFS Ganesha long-running stress
      module: upstream_nfs_long_running.py
      desc: Multi-hour create/delete/lock stress on Scale NFS (NFSv3; no deploy)
      abort-on-fail: false
      timeout: 28800
      config:
        clients: 1
        nfs_export: /ibm/scale_volume/export1
        suite_cleanup: true
