#===============================================================================================
# ganesha_mgr Tier-1 functional suite (Spectrum Scale CES NFS).
#
# Deploy once, then run ganesha_mgr Tier-1 coverage only.
#
# Conf: conf/spectrum_scale/spectrum_scale_2node.yaml (installer + 2 clients)
#===============================================================================================
tests:
  - test:
      name: Spectrum Scale multi-node deploy
      module: upstream_nfs_deploy.py
      desc: Deploy Scale / NFS once for the combined suite
      abort-on-fail: true
      timeout: 14400
      config:
        clients: 2
        nfs_export: /ibm/scale_volume/export1
        scale_installer_source: nfs_share

  - test:
      name: ganesha_mgr Tier1 functional
      module: test_ganesha_mgr_tier1.py
      desc: Tier-1 ganesha_mgr coverage on Scale CES NFS (exports/clients/cache/logs/condlog/grace/trim)
      abort-on-fail: false
      timeout: 7200
      config:
        skip_deployment: true
        clients: 2
        nfs_version: "4.1"
        mount_point: /mnt/nfs
        nfs_export: /ibm/scale_volume/export1
        port: "2049"
        enable_dbus_export_mutate: true
        enable_shutdown: false
