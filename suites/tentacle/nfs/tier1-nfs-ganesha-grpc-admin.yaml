#===============================================================================================
#---  NFS Ganesha gRPC API Suite (CephFS) ---
#===============================================================================================
# Conf: conf/tentacle/nfs/1admin-7node-3client.yaml
#
# gRPC-only interface validation. Does NOT run NFS protocol regression
# (cthon/pynfs/locks/POSIX/scale) — those live in existing NFS suites.
# D-Bus remains the cephadm management path until a later release; this suite
# only asserts that Ganesha gRPC APIs work as expected.
#
# Requires a gRPC-built NFS image — set nfs_container_image in Jenkins/config.
#
# Modules: tests/nfs/grpc_admin/
# Related smoke: tier1-nfs-ganesha-grpc.yaml (core nfsService RPCs)
# Optional perf: tier1-nfs-ganesha-grpc-perf.yaml
#===============================================================================================
tests:
  - test:
      abort-on-fail: true
      desc: Install software pre-requisites for cluster deployment.
      module: install_prereq.py
      name: setup pre-requisites

  - test:
      abort-on-fail: true
      config:
        steps:
          - config:
              command: bootstrap
              service: cephadm
              args:
                mon-ip: node1
          - config:
              command: add_hosts
              service: host
              args:
                attach_ip_address: true
                labels: apply-all-labels
          - config:
              command: apply
              service: osd
              args:
                all-available-devices: true
          - config:
              args:
                - "ceph fs volume create cephfs"
              command: shell
          - config:
              args:
                placement:
                  label: mds
              base_cmd_args:
                verbose: true
              command: apply
              pos_args:
                - cephfs
              service: mds
      desc: Bootstrap and deploy Ceph services for NFS gRPC API testing.
      destroy-cluster: false
      module: test_cephadm.py
      name: Deploy cluster using cephadm

  - test:
      abort-on-fail: true
      config:
        command: add
        id: client.1
        node: node4
        install_packages:
          - ceph-common
          - ceph-fuse
        copy_admin_keyring: true
      desc: Configure client 1 for NFS gRPC API testing
      destroy-cluster: false
      module: test_client.py
      name: configure client 1

  - test:
      abort-on-fail: true
      config:
        command: add
        id: client.2
        node: node5
        install_packages:
          - ceph-common
          - ceph-fuse
        copy_admin_keyring: true
      desc: Configure client 2 for NFS gRPC API testing
      destroy-cluster: false
      module: test_client.py
      name: configure client 2

  - test:
      name: gRPC API - Set NFS Container Image
      module: grpc_admin.test_grpc_ganesha_deploy.py
      desc: Override mgr/cephadm/container_image_nfs when nfs_container_image is set
      abort-on-fail: false
      config:
        operation: set_nfs_image
        # nfs_container_image: quay.io/rhceph/nfs-ganesha-grpc:<tag>

  # =============================================================================
  # Transport / discovery
  # =============================================================================
  - test:
      name: gRPC API - Verify Port 50051 Listening
      module: grpc_admin.test_grpc_ganesha_admin.py
      desc: Verify gRPC admin port is listening on the NFS node
      abort-on-fail: false
      config:
        operation: verify_port
        nfs_name: cephfs-nfs
        nfs_export: /export
        fs_name: cephfs
        clients: 1
        nfs_version: 4.1
        port: 2049

